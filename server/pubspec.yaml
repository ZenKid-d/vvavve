name: vvavve_bff
description: Прокси-сервер веб-версии vvavve — обходит CORS и подписывает потоки.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.2.0
  crypto: ^3.0.3
  # Проверка подписи RS256 у токенов Firebase. Своими руками это разбор ASN.1
  # и RSA — ровно тот код, который нельзя писать самому.
  dart_jsonwebtoken: ^2.14.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
